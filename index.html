<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="favicon.ico" rel="shortcut icon" />
<style>
body{
  overflow: hidden;
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
}
h1{
  position: fixed;
  top: 50%;
  left: 0;
  z-index: 1;
  box-sizing: border-box;
  width: 100%;
  text-align: center;
  transform:translateY(-50%);
  font-family: 'Love Ya Like A Sister', cursive;
  font-size: clamp(24px, 4vw, 40px);
  color: #c70012;
  padding: 0 20px;
}
h1 span{
    font-size: clamp(14px, 2vw, 20px);
    line-height: 2.2;
}
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
</style>

</head>
<body>
<div style="position:fixed; float:none; float:none; top:0px; margin:auto; ">
  <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width=30% height=86 src="https://music.163.com/outchain/player?type=2&id=209909&auto=1&height=66"></iframe>

<h1 id="h1"></h1>
<canvas></canvas> 

<script>
var canvas = document.querySelector("canvas"),
  ctx = canvas.getContext("2d");

var ww, wh, pixelRatio;

function onResize(){
  ww = window.innerWidth;
  wh = window.innerHeight;
  pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(ww * pixelRatio);
  canvas.height = Math.round(wh * pixelRatio);
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

var hearts = [];
var maxHearts = window.matchMedia("(max-width: 600px)").matches ? 55 : 90;
var lastPointerSpawn = 0;

function createHeartSprite(){
  var sprite = document.createElement("canvas");
  var spriteCtx = sprite.getContext("2d");
  var size = 96;
  sprite.width = size;
  sprite.height = size;
  spriteCtx.translate(size / 2, size / 2);
  spriteCtx.scale(1.35, 1.35);
  spriteCtx.fillStyle = "#ff5964";
  spriteCtx.shadowBlur = 14;
  spriteCtx.shadowColor = "rgba(255, 70, 80, 0.75)";
  spriteCtx.beginPath();
  for (var i = 0; i <= 40; i++) {
    var step = (i / 40 - 0.5) * Math.PI * 2;
    var x = 15 * Math.pow(Math.sin(step), 3);
    var y = -(13 * Math.cos(step) - 5 * Math.cos(2 * step) - 2 * Math.cos(3 * step) - Math.cos(4 * step));
    if (i === 0) {
      spriteCtx.moveTo(x, y);
    } else {
      spriteCtx.lineTo(x, y);
    }
  }
  spriteCtx.closePath();
  spriteCtx.fill();
  return sprite;
}

var heartSprite = createHeartSprite();

function onMove(e){
  var now = performance.now();
  if (now - lastPointerSpawn < 24) {
    return;
  }
  lastPointerSpawn = now;
  addHeart(e.clientX, e.clientY);
  addHeart(e.clientX, e.clientY);
}

var Heart = function(x,y){
  this.x = typeof x === "number" ? x : Math.random() * ww;
  this.y = typeof y === "number" ? y : Math.random() * wh;
  this.size = Math.random() * 36 + 28;
  this.speedX = (Math.random() - 0.5) * 4;
  this.speedY = (Math.random() - 0.5) * 4;
  this.life = 1;
  this.fadeSpeed = Math.random() * 0.012 + 0.008;
  this.opacity = 1;
}

Heart.prototype.draw = function(){
  this.x += this.speedX;
  this.y += this.speedY;
  this.life -= this.fadeSpeed;
  var drawSize = this.size * Math.max(this.life, 0);
  ctx.globalAlpha = Math.min(this.life * 1.4, 1);
  ctx.drawImage(heartSprite, this.x - drawSize / 2, this.y - drawSize / 2, drawSize, drawSize);
};

function addHeart(x, y){
  if (hearts.length >= maxHearts) {
    hearts.shift();
  }
  hearts.push(new Heart(x, y));
}

var frame = 0;
function render(){
  requestAnimationFrame(render);
  if (document.hidden) {
    return;
  }
  frame++;
  if (frame % 2 === 0) {
    addHeart();
  }
  ctx.clearRect(0,0,ww,wh);
  for (var i = 0; i < hearts.length; i++) {
    hearts[i].draw();
    if(hearts[i].life <= 0){
      hearts.splice(i,1);
      i--;
    }
  }
  ctx.globalAlpha = 1;
}


onResize();
window.addEventListener("pointermove", onMove, { passive: true });
window.addEventListener("resize", onResize);
requestAnimationFrame(render);

window.onload=function starttime(){
        time(document.getElementById("h1"));     // 在一起的时间
        window.setTimeout(starttime,1000); // 添加计时器
}

    function time(obj){
        var nowtime = new Date().getTime(); // 现在时间转换为时间戳
        var futruetime = new Date(2021, 1, 14, 0, 0, 0).getTime(); // 2021年2月14日（本地时间）
        var msec = nowtime-futruetime; // 毫秒 未来时间-现在时间
        var time = (msec/1000);  // 毫秒/1000
        var day = parseInt(time/86400); // 天  24*60*60*1000 
        var hour = parseInt(time/3600)-24*day;    // 小时 60*60 总小时数-过去的小时数=现在的小时数 
        var minute = parseInt(time%3600/60); // 分 -(day*24) 以60秒为一整份 取余 剩下秒数 秒数/60 就是分钟数
        var second = parseInt(time%60);  // 以60秒为一整份 取余 剩下秒数
//              console.log(hour+":"+minute+":"+second)
//              alert(hour)
        obj.innerHTML="亲爱的饼饼宝贝！<br>咱俩在一起的时间已经：<br>"+day+"天"+hour+"小时"+minute+"分"+second+"秒"+"了<br><span>能够遇见你是我最大的幸运！<br>有了你生活变得丰富多彩，<br>有了你世界变得如此迷人，<br>中间的计时器将永远见证我们爱过的岁月。<br>你是我的世界，我的世界是你,<br>对我来说，不是在最美好的时光遇见你，<br>而是遇见你后都是最美好的时光！</span>"

        return true;
    }
</script>

</body>
</html>
